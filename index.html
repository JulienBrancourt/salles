<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste des Salles</title>
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t.replace('-theme','')}catch(e){}</script>
  <link rel="preload" href="fonts/atkinson-hyperlegible-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bricolage-grotesque-wght.woff2" as="font" type="font/woff2" crossorigin>
  <script>document.write('<link rel="stylesheet" id="siteStyle" href="'+(function(){var s=null;try{s=localStorage.getItem('style')}catch(e){}if(s==='defaut')return'style.css';if(s&&/^[a-z]+$/.test(s))return'style_'+s+'.css';var j=['','','contraste','terminal','alternatif','papier',''][new Date().getDay()];return j?'style_'+j+'.css':'style.css'})()+'" onerror="this.onerror=null;this.href=\'style.css\'">')</script>
  <noscript><link rel="stylesheet" href="style.css"></noscript>
  <link rel="icon" type="image/png" href="favicon-32x32.png">
  <script src="header-component.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script> <!-- librairie pour le graphique -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script> <!--librairie pour l'export vers Excel -->
  <script src="script.js" defer></script>
  
</head>
<body>

  <app-header></app-header>

  <main class="page">

  <h1>Liste des Salles :
    <select id="siteSelect" class="title-select" aria-label="Site">
      <option value="">Tous les sites</option>
      <option value="CITA">Citadelle</option>
      <option value="SC">Saint Leu</option>
    </select>
  </h1>

    <p id="dataError" class="alert" role="alert" hidden></p>

  <div class="filters">
    <input type="text" id="searchInput" class="field" aria-label="Rechercher une salle" placeholder="Nom de la salle">

    <select id="categorySelect" class="field" aria-label="Catégorie">
      <option value="">Toutes les catégories</option>
    </select>

    <form>
        <fieldset class="field-group">
            <legend>Bâtiments</legend>
            <div id="buildingCheckboxes" class="check-group"></div>
        </fieldset>
    </form>

    <button id="resetButton" class="btn">Réinitialiser les filtres</button>
  </div>

  <div class="table-container">
    <button onclick="exporterEnExcel('dataTable')" id="btnExportExcel" class="btn">
      <img src="https://img.icons8.com/color/24/000000/microsoft-excel-2019--v1.png" alt="Excel Icon">
      <span>Exporter vers Excel</span>
    </button>
  
    <table id="dataTable" class="responsive-table">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Capacité</th>
          <th>Examen</th>
          <th>Catégorie</th>
          <th>Réservé</th>
          <th>Bâtiment</th>
          <th>Accessibilité</th>
          <th>Observation</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  

  <div class="chart-card">
    <canvas id="capacityChart"></canvas>
  </div>


  <form id="contact" class="contact-form" action="https://api.web3forms.com/submit" method="POST">
    <h2>Une suggestion ?</h2>
  
    <input type="hidden" name="access_key" value="f6513fdb-6e04-4af5-81ac-f73fda3b9201">

    <!-- Form Inputs. Each input must have a name="" attribute -->
    <input type="text" name="name" class="field" aria-label="Nom" placeholder="Nom" autocomplete="off" required>
    <textarea name="message" class="field" aria-label="Message" placeholder="Message..." autocomplete="off" required></textarea>

    <!-- Honeypot Spam Protection -->
    <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

    <!-- Custom Confirmation / Success Page -->
    <!-- <input type="hidden" name="redirect" value="https://mywebsite.com/thanks.html"> -->

    <button type="submit" id="submitButton" class="btn btn--primary">Envoyer la suggestion</button>
    <p id="result" class="msg" role="status" aria-live="polite" hidden></p>

  </form>

  </main>

  <button onclick="topFunction()" id="scrollToTopButton" class="btn btn--icon scroll-top" aria-label="Retour en haut de la page">↑</button>

  <footer>
    <p>Julien Brancourt - 16/04/2025</p>
  </footer>

  

</body>
</html>
