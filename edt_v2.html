<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<body>
    <app-header></app-header>
    <main class="planning-salles">
<h1>Heure de début d'utilisation des salles</h1>
<p class="lead">Chargez le diagramme d'utilisation des salles (PDF CELCAT). Pour chaque salle, la première heure de début est relevée (au quart d'heure), puis un nouveau PDF est généré, page par bâtiment.</p>
<label class="drop" id="drop"><input type="file" id="file" accept="application/pdf" hidden><span id="dropText">Déposez le PDF ici ou cliquez pour le choisir</span></label>
<label class="opt"><input type="checkbox" id="skipCancelled" checked> Ignorer les cours « Annulé »</label>
<p id="status" class="status"></p>
<button id="dl" disabled>Télécharger le PDF</button>
<section id="preview"></section>
</main>

    
</body>
